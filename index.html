<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Gesture Emoji Keyboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app-container">
    <h1>Gesture Emoji Keyboard</h1>
    
    <textarea id="text-box" placeholder="Tap keys or swipe left on the keyboard to delete..."></textarea>

    <div class="keyboard-container" id="keyboard-area">
      
      <div id="letters-panel" class="grid letters-grid"></div>

      <div id="emoji-section" class="emoji-section">
        <div class="category-header">
          <button type="button" id="prev-category-btn" class="nav-arrow">◄</button>
          <span id="category-title" class="category-title">Smileys</span>
          <button type="button" id="next-category-btn" class="nav-arrow">►</button>
        </div>

        <div id="emoji-panel" class="grid emoji-grid"></div>
      </div>

      <div class="controls">
        <button type="button" id="toggle-btn" class="control-btn">Switch to Emoji (😀)</button>
        <button type="button" id="backspace-btn" class="control-btn action-btn">⌫ Delete</button>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
